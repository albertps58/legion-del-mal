name: Comunicador de la Légion

on:
  workflow_dispatch:
    inputs:
      villano:
          description: "Que villano envia el mensaje?"
          required: true
          type: choice
          options:
            - Lex Luthor
            - Magneto
            - Joker
      prioridad:
          description: "Nivel prioridad"
          required: true
          type: choice
          options:
            - Baja
            - Alta
            - Critica
      mensaje:
          description: "Que villano envia el mensaje?"
          required: true
          default: "La misión fue un éxito"
            
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    
    steps:
      - name: Imprimir  inputs
        run: |
            echo "Inputs:"
            echo ""
            echo "Villano: ${{inputs.villano}}"
            echo "Villano: ${{inputs.prioridad}}"
            echo "Villano: ${{inputs.mensaje}}"

