name: Comunicador de la Légion

on:
  workflow_dispatch:
    inputs:
      villano:
          description: "Que villano envia el mensaje?"
          required: true
          type: choice
          options:
            - Lex Luthor
            - Magneto
            - Joker
      prioridad:
          description: "Nivel prioridad"
          required: true
          type: choice
          options:
            - Baja
            - Alta
            - Critica
      mensaje:
          description: "Que villano envia el mensaje?"
          required: true
          default: "La misión fue un éxito"
      
      cow-caracter:
          description: "Que caracter quieres?"
          required: true
          type: choice
          options:
            - banana
            - dragon
            - sheep
            
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    
    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir  inputs
        run: |
            echo "-----------------------"
            echo "Transmisión interceptada!!!"
            echo "-----------------------"
            echo "De: ${{inputs.villano}}"
            echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
            echo "-------Mensaje--------"
            cowsay -f "${{inputs.cow-caracter}}" "${{inputs.mensaje}}"

