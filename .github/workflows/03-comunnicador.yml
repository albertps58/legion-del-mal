name: Comunicador de la Légion

on:
  workflow_dispatch:
    inputs:
      villano:
          description: "Que villano envia el mensaje?"
          required: true
          type: choice
          options:
            - Lex Luthor
            - Magneto
            - Joker
      mensaje:
          description: "Que villano envia el mensaje?"
          required: true
          type: choice
          options:
            - Lex Luthor
            - Magneto
            - Joker
      prioridad:
          description: "Nivel de prioridad"
          required: true
          default: "La misión fue un éxito"
            
jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
