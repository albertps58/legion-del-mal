name: 🛡️ Acceso a la Fortaleza Prohibida

on: 
    workflow_dispatch: 
    
jobs:
    accesso-a-la-fortaleza:
        runs-on: ubuntu-latest

        steps:
            - name: El agente llega a la fortaleza
              run: |
                echo "El agente ${{github.actor}} ha llegado a la fortaleza prohibida."
                echo "Preparando para el acceso seguro..."
                echo "Buscando los archivos de la legion..."
                ls -la
                echo "No hay nada"

            - name: "Brainiac desbloquea el accesso a la boveda"
              uses: actions/checkout@v4

            - name: "Ahora si vamos a ver los planes"
              run: |
                echo "Buscar los archivos de la Legión"
                ls -la
                echo "Funciona"
                echo ""
                echo "Planes:"
                ls planes/
                echo "Villanos:"
                ls miembros/
                echo "Inteligencia:"
                ls inteligencia/
